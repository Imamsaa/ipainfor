'2a2':[{q:'Penyerapan sebagian besar nutrien berlangsung terutama di …',a:['Usus halus','Kerongkongan','Mulut','Trakea'],c:0,e:'Usus halus memiliki permukaan luas untuk penyerapan nutrien.'},{q:'Fungsi utama sel darah merah adalah …',a:['Menghasilkan empedu','Mengangkut oksigen','Mencerna protein','Menyaring urine'],c:1,e:'Hemoglobin dalam sel darah merah mengikat dan mengangkut oksigen.'},{q:'Organ utama pertukaran gas pada manusia adalah …',a:['Lambung','Ginjal','Alveolus di paru-paru','Usus besar'],c:2,e:'Pertukaran oksigen dan karbon dioksida berlangsung di alveolus.'}],
'3a1':[{q:'Rangsangan cahaya diterima oleh …',a:['Reseptor pada mata','Lidah','Kulit saja','Tulang'],c:0,e:'Mata memiliki reseptor yang peka terhadap cahaya.'},{q:'Zat adiktif perlu diwaspadai karena dapat …',a:['Selalu meningkatkan kesehatan','Menimbulkan ketergantungan','Menggantikan makanan','Menghilangkan kebutuhan tidur'],c:1,e:'Zat adiktif dapat memengaruhi sistem saraf dan menyebabkan ketergantungan.'},{q:'Sikap tepat ketika mendapat tawaran zat berbahaya adalah …',a:['Mencoba sedikit','Menolak dan mencari bantuan orang dewasa tepercaya','Menyimpan untuk teman','Mengikuti tekanan teman'],c:1,e:'Menolak dengan tegas dan meminta dukungan merupakan pilihan aman.'}],
'3a2':[{q:'Saat tubuh kepanasan, salah satu respons yang membantu melepas panas adalah …',a:['Berkeringat','Menghentikan napas','Menghentikan aliran darah','Menaikkan suhu tanpa batas'],c:0,e:'Penguapan keringat membantu membuang panas dari tubuh.'},{q:'Homeostasis berarti …',a:['Tubuh tidak pernah berubah','Menjaga kondisi internal tetap relatif stabil','Semua organ bekerja sendiri','Suhu selalu sama persis'],c:1,e:'Homeostasis mempertahankan kondisi internal dalam rentang yang sesuai.'},{q:'Ketika cairan tubuh berkurang, tubuh perlu …',a:['Menghindari air','Mengembalikan keseimbangan cairan','Menghentikan kerja ginjal','Mengabaikan rasa haus'],c:1,e:'Asupan cairan dan pengaturan ginjal membantu menjaga keseimbangan cairan.'}],

function readStored(key,fallback){try{const value=localStorage.getItem(key);return value===null?fallback:value}catch(e){return fallback}}
const state={page:'home',xp:Number(readStored('jelajah_xp','0'))||0,done:(()=>{try{const v=JSON.parse(readStored('jelajah_done','[]'));return Array.isArray(v)?v.filter(id=>chapters.some(ch=>ch.id===id)):[]}catch(e){return []}})(),quiz:{},lab:(()=>{try{const v=JSON.parse(readStored('jelajah_lab','{}'));return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}})(),experiments:(()=>{try{const v=JSON.parse(readStored('jelajah_experiments','{}'));return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}})(),quest:(()=>{try{const v=JSON.parse(readStored('jelajah_quest','{}'));return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}})(),score:0};
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem('jelajah_xp',state.xp);localStorage.setItem('jelajah_done',JSON.stringify(state.done));localStorage.setItem('jelajah_lab',JSON.stringify(state.lab));localStorage.setItem('jelajah_experiments',JSON.stringify(state.experiments));localStorage.setItem('jelajah_quest',JSON.stringify(state.quest))}catch(e){/* Browser storage may be disabled; the current session still works. */}$('#xpPill').textContent='✦ '+state.xp+' XP'}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
function award(id,amount=20){if(id.startsWith('chapter:')){const chapterId=id.slice(8);if(!state.done.includes(chapterId)){state.done.push(chapterId);state.xp+=amount;save();toast('Bab selesai! +'+amount+' XP ✨')}else toast('Bab ini sudah dituntaskan. Terus eksplorasi!');return}if(!state.lab[id]){state.lab[id]=true;state.xp+=amount;save();toast('Aktivitas tercatat! +'+amount+' XP ✨')}else toast('Aktivitas ini sudah dicoba. Terus eksplorasi!')}
function nav(){['1a','2a','3a'].forEach((b,i)=>{const el=$('#nav'+(i+1));el.innerHTML='';chapters.filter(c=>c.book===b).forEach(c=>{let btn=document.createElement('button');btn.className='navitem '+(state.page===c.id?'active':'');btn.innerHTML=`<span class="num">${c.n.toString().padStart(2,'0')}</span><span>${c.title}</span>`;btn.onclick=()=>go(c.id);el.append(btn)})})}
function go(id){state.page=id;$('#sidebar').classList.remove('open');render();nav();window.scrollTo(0,0)}
function home(){return `<section class="hero"><div><div class="eyebrow">✦ LABORATORIUM BELAJAR SMP</div><h1>Buka lab.<br><span style="color:var(--cyan)">Uji sains.</span> Temukan!</h1><p>Masuk ke ruang praktikum digital. Ubah variabel, amati simulasi, catat hasil, lalu tarik kesimpulan dari 10 bab buku Jawara IPA 1a, 2a, dan 3a.</p><button class="btn" onclick="go('1a1')">Masuk Virtual Lab ↗</button> <button class="btn secondary" onclick="document.getElementById('chapters').scrollIntoView({behavior:'smooth'})">Pilih bab</button></div><div class="hero-art"><div class="orbit"></div><div class="orbit two"></div><div class="orb">⚗️</div></div></section><div class="stats"><div class="stat"><strong>10</strong><span>Bab interaktif</span></div><div class="stat"><strong>${state.done.length}/10</strong><span>Misi diselesaikan</span></div><div class="stat"><strong>${state.xp} ✦</strong><span>Total XP kamu</span></div></div><div class="section-head"><div><h2>Pilih laboratorium</h2><p>Setiap bab punya meja eksperimen dan alat yang berbeda.</p></div></div><div class="book-grid"><div class="book" onclick="go('1a1')"><div class="emoji">🧪</div><h3>Buku 1a · IPA Dasar</h3><p>Sains, zat, gerak, dan gaya.</p><div class="progressbar"><i style="width:${chapters.filter(c=>c.book==='1a'&&state.done.includes(c.id)).length/3*100}%"></i></div><small>${chapters.filter(c=>c.book==='1a'&&state.done.includes(c.id)).length}/3 bab tuntas</small></div><div class="book" onclick="go('2a1')"><div class="emoji">🧬</div><h3>Buku 2a · Biologi</h3><p>Sel dan sistem tubuh makhluk hidup.</p><div class="progressbar"><i style="width:${chapters.filter(c=>c.book==='2a'&&state.done.includes(c.id)).length/2*100}%"></i></div><small>${chapters.filter(c=>c.book==='2a'&&state.done.includes(c.id)).length}/2 bab tuntas</small></div><div class="book" onclick="go('3a1')"><div class="emoji">🌌</div><h3>Buku 3a · Sistem & Fisika</h3><p>Koordinasi, homeostasis, genetika, tekanan.</p><div class="progressbar"><i style="width:${chapters.filter(c=>c.book==='3a'&&state.done.includes(c.id)).length/5*100}%"></i></div><small>${chapters.filter(c=>c.book==='3a'&&state.done.includes(c.id)).length}/5 bab tuntas</small></div></div><div class="section-head" id="chapters"><div><h2>Semua misi</h2><p>Tekan bab untuk masuk ke halaman belajar dan game yang berbeda.</p></div></div><div class="chapter-list">${chapters.map(c=>`<button class="chapter-card" onclick="go('${c.id}')"><span class="chapter-icon">${c.icon}</span><span><small>BUKU ${c.book.toUpperCase()} · BAB ${c.n} ${state.done.includes(c.id)?' · ✓ TUNTAS':''}</small><b>${c.title}</b></span><span class="arrow">↗</span></button>`).join('')}</div>`}
function chapterPage(c){return `<div class="chapter-header"><span class="tag">BUKU ${c.book.toUpperCase()} · BAB ${c.n}</span><h1>${c.icon} ${c.title}</h1><p>${c.desc}</p><div class="progressbar"><i style="width:${state.done.includes(c.id)?100:0}%"></i></div><small class="muted">${state.done.includes(c.id)?'Misi bab telah diselesaikan':'Selesaikan aktivitas untuk mendapatkan XP'}</small></div><div class="learn-grid"><section class="panel"><div class="eyebrow">01 · MISI BELAJAR</div><h2>Target eksplorasi</h2><p class="muted">${c.goal}</p><h3>Yang akan kamu pelajari</h3><ul class="objectives">${c.topics.map(t=>`<li>${t}</li>`).join('')}</ul><div class="key-concept"><b>Inti konsep</b><br>${c.concept}</div><p class="muted" style="font-size:12px">Baca konsep, coba simulasi, lalu jawab tantangan. Hasil game adalah latihan belajar, bukan pengganti praktikum nyata.</p></section><section class="panel"><div class="eyebrow">02 · LAB INTERAKTIF</div><h2>${gameTitle(c.game)}</h2><div class="game" id="game">${gameHTML(c)}</div></section></div><section class="panel" style="margin-top:16px"><div class="eyebrow">03 · CEK PEMAHAMAN</div><h2>Tantangan cepat</h2><p class="muted">Pilih jawaban paling tepat. Baca penjelasannya setelah menjawab.</p><div id="quiz">${quizHTML(c)}</div></section><div class="footer-actions"><button class="btn secondary" onclick="prev('${c.id}')">← Bab sebelumnya</button><button class="btn" onclick="next('${c.id}')">Bab berikutnya →</button></div>`}

function quizHTML(c){let q=qs[c.id][0];return `<div class="quiz-question" data-index="0"><div class="tag">PERTANYAAN 1 / 3</div><h3>${q.q}</h3><div class="quiz-options">${q.a.map((a,i)=>`<button class="choice" onclick="answer('${c.id}',0,${i},this)">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div class="feedback" id="quizFeedback"></div><div class="game-actions"><button class="btn small" id="nextQ" disabled onclick="nextQuestion('${c.id}')">Pertanyaan berikutnya →</button></div></div>`}
function answer(id,qi,choice,btn){let qsx=qs[id],q=qsx[qi];const key=id+':'+qi;if(state.quiz[key]!==undefined)return;state.quiz[key]=choice;let parent=btn.parentElement;[...parent.children].forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});$('#quizFeedback').textContent=(choice===q.c?'Benar! ':'Belum tepat. ')+q.e;$('#quizFeedback').style.color=choice===q.c?'#70e5b5':'#ffb2c9';$('#nextQ').disabled=false;if(choice===q.c){state.xp+=5;save()}}
function nextQuestion(id){let current=0;while(state.quiz[id+':'+current]!==undefined)current++;let qarr=qs[id];if(current>=qarr.length){award('chapter:'+id,20);$('#quiz').innerHTML=`<div class="game-stage"><div class="visual">🏆</div><h3>Tantangan selesai!</h3><p class="muted">Kamu telah menyelesaikan kuis bab ini. Coba simulasi lagi atau lanjut ke bab berikutnya.</p><button class="btn" onclick="go('${nextId(id)||id}')">Lanjut petualangan →</button></div>`;return}let q=qarr[current];$('#quiz').innerHTML=`<div class="quiz-question"><div class="tag">PERTANYAAN ${current+1} / ${qarr.length}</div><h3>${q.q}</h3><div class="quiz-options">${q.a.map((a,i)=>`<button class="choice" onclick="answer('${id}',${current},${i},this)">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div class="feedback" id="quizFeedback"></div><div class="game-actions"><button class="btn small" id="nextQ" disabled onclick="nextQuestion('${id}')">Lanjut →</button></div></div>`}
function runLab(type){if(type==='plant'){let l=$('#light').value,w=$('#water').value;$('#plant').textContent=w==='low'?'🥀':l==='high'?'🌿':'🌱';$('#plantLabel').textContent=w==='low'?'Tanaman tampak layu':l==='high'?'Cahaya cukup untuk fotosintesis':'Pertumbuhan mungkin terbatas';$('#plantText').textContent=w==='low'?'Air menjadi faktor pembatas. Untuk percobaan adil, ubah satu variabel dan jaga yang lain tetap.':l==='high'?'Catat hasil, lalu bandingkan dengan kondisi cahaya rendah.':'Ulangi dengan cahaya berbeda dan air tetap.';$('#gameFeedback').textContent='Observasi dicatat. Simulasi ini ilustrasi sederhana, bukan data eksperimen nyata.';award('lab-'+state.page,5)}
if(type==='motion'){let mode=$('#motionMode').value,t=+$('#time').value;let b=$('#motionBall');b.style.transition='left 1s ease-out';b.style.left=(mode==='glb'?10+t*13:10+t*t*4)+'%';$('#motionResult').textContent=mode==='glb'?`Model GLB: jarak bertambah sebanding dengan waktu (${t} s).`:`Model GLBB: jarak bertambah makin besar tiap interval waktu (${t} s).`;$('#gameFeedback').textContent='Bandingkan posisi akhir dan ulangi dengan waktu berbeda.';award('motion-'+state.page,5)}}
function heatMatter(v){v=+v;$('#heatVal').textContent=v;$('#heatMeter').style.width=v+'%';let s=v<33?['🧊','Padat','Partikel rapat, bergetar di tempat.']:v<67?['💧','Cair','Partikel lebih bebas bergerak dan dapat mengalir.']:['☁️','Gas','Partikel berjauhan dan bergerak bebas.'];$('#matterEmoji').textContent=s[0];$('#matterState').textContent=s[1];$('#matterDesc').textContent=s[2];$('#gameFeedback').textContent='Energi partikel berubah. Perubahan wujud tidak otomatis berarti terbentuk zat baru.'}
function matterChange(t){$('#gameFeedback').textContent=t==='physical'?'Contoh fisika: es mencair, air menguap, kertas dipotong. Zat tidak berubah menjadi zat baru.':'Contoh kimia: besi berkarat atau kayu terbakar. Terbentuk zat baru.';award('matter-'+state.page,3)}
function cellPick(x){let good=x==='dinding';$('#cellExplain').textContent=good?'Tepat! Dinding sel memberi dukungan dan perlindungan pada sel tumbuhan.':'Coba lagi. Ingat: yang dicari adalah lapisan kuat di luar membran sel tumbuhan.';$('#cellEmoji').textContent=good?'🌿':'🔎';$('#gameFeedback').textContent=good?'Puzzle terpecahkan!':'Belum tepat, amati petunjuknya.';if(good)award('cell-'+state.page,5)}
function bodyPick(x){$('#bodyExplain').textContent=x===0?'Tepat! Oksigen masuk melalui saluran pernapasan dan berdifusi di alveolus, lalu diangkut darah ke sel.':'Belum tepat. Pilih bagian sistem pernapasan tempat pertukaran gas berlangsung.';$('#gameFeedback').textContent=x===0?'Jalur oksigen lengkap!':'Coba lagi.';if(x===0)award('body-'+state.page,5)}
let senseIndex=0;const senses=[['🔔','Bunyi bel diterima oleh indra apa?','telinga'],['🍋','Rasa asam dikenali oleh indra apa?','lidah'],['🌞','Cahaya terang diterima oleh indra apa?','mata'],['🧊','Sentuhan dingin dirasakan oleh indra apa?','kulit'],['🌸','Aroma bunga dikenali oleh indra apa?','hidung']];
function sensePick(v){let s=senses[senseIndex];let ok=v===s[2];$('#senseExplain').textContent=ok?'Benar! Rangsangan diterima reseptor yang sesuai.':'Belum tepat. Pikirkan jenis rangsangannya.';if(ok){senseIndex=(senseIndex+1)%senses.length;setTimeout(()=>{let n=senses[senseIndex];$('#senseEmoji').textContent=n[0];$('#sensePrompt').textContent=n[1]},650);award('sense-'+state.page,3)}$('#gameFeedback').textContent=ok?'Satu rangsangan berhasil dikenali.':'Coba lagi.'}
let temp=37;function tempChange(d){temp=Math.max(33,Math.min(41,temp+d));$('#tempVal').textContent=temp;$('#tempMeter').style.width=((temp-33)/8*100)+'%';$('#tempText').textContent=temp>37?'Tubuh merespons panas, misalnya melalui keringat dan pelebaran pembuluh darah kulit.':temp<37?'Tubuh membantu mempertahankan panas, misalnya dengan menggigil.':'Kondisi kembali ke nilai acuan simulasi.';$('#gameFeedback').textContent='Homeostasis bekerja menjaga kondisi internal tetap dalam rentang yang sesuai.'}function tempReset(){temp=37;tempChange(0);award('homeo-'+state.page,5)}
let repro=['🔬 Pembelahan sel','🧩 Sel baru','🌱 Pertumbuhan'];function reproDraw(){$('#reproOrder').innerHTML=repro.map((x,i)=>`<button class="choice" onclick="reproMove(${i})">${x} ↕</button>`).join('')}function reproMove(i){if(i<repro.length-1){[repro[i],repro[i+1]]=[repro[i+1],repro[i]];reproDraw()}}function reproShuffle(){repro=['🌱 Pertumbuhan','🔬 Pembelahan sel','🧩 Sel baru'];reproDraw();$('#reproExplain').textContent='Coba susun kembali dari proses awal.'}function reproCheck(){let ok=repro[0].includes('Pembelahan')&&repro[1].includes('Sel baru')&&repro[2].includes('Pertumbuhan');$('#reproExplain').textContent=ok?'Tepat! Pembelahan menghasilkan sel baru yang mendukung pertumbuhan.':'Belum tepat. Pembelahan sel terjadi sebelum sel baru digunakan untuk pertumbuhan.';if(ok)award('repro-'+state.page,5)}
function geneCombine(){let a=$('#geneA').value,b=$('#geneB').value,r=a+b;$('#geneResult').textContent='🧬';$('#geneLabel').textContent=r==='aA'?'Aa':r;$('#geneExplain').textContent='Kombinasi alel yang kamu pilih membentuk genotipe '+(r==='aA'?'Aa':r)+'. Dalam persilangan Aa × Aa, empat kombinasi sama peluang pada model sederhana.';award('gene-'+state.page,3)}
function pressureCalc(){let f=+$('#force').value,a=+$('#area').value,p=f/a;$('#forceVal').textContent=f;$('#areaVal').textContent=a;$('#pressureResult').textContent='Tekanan relatif: '+p.toFixed(2);$('#pressureMeter').style.width=Math.min(100,p/25*100)+'%';$('#pressureText').textContent=p>3?'Tekanan relatif tinggi karena gaya besar dibanding luas bidang.':p<1.5?'Tekanan relatif rendah karena gaya kecil dibanding luas bidang.':'Tekanan relatif sedang. Coba kecilkan luas dengan gaya tetap.'}

 const q=questData[c.id][stage];
 return `<div class="quest-bar"><div><span class="eyebrow">LEVEL ${stage+1} / 3</span><h3>${q.title}</h3></div><div class="streak-badge">⚡ ${stage===0?'Siap mulai':stage===1?'Bagus!':'Final stage'}</div></div><div class="quest-track">${[0,1,2].map(i=>`<span class="${stage>i?'done':stage===i?'active':''}"></span>`).join('')}</div><div class="mission-brief"><div class="brief-character">${sc.emoji}</div><div><b>Pesan dari pemandu</b><p>${q.story}</p></div></div><div class="quest-question"><span class="question-type">${['OBSERVASI','TANTANGAN KONSEP','BOSS CHALLENGE'][stage]}</span><h3>${q.prompt}</h3><div class="quest-options">${q.options.map((option,i)=>`<button class="quest-option" onclick="questPick('${c.id}',${stage},${i},this)"><span>${String.fromCharCode(65+i)}</span>${option}<b>↗</b></button>`).join('')}</div><div id="questFeedback" class="quest-feedback" aria-live="polite">Pilih jawaban untuk menjalankan misi.</div></div><div class="mini-sim">${miniLabHTML(c)}</div>`;

function questPick(id,stage,choice,button){
 const q=questData[id][stage],feedback=document.getElementById('questFeedback');
 if(!feedback||(state.quest[id]||0)!==stage)return;
 const buttons=[...document.querySelectorAll('.quest-option')];buttons.forEach(b=>b.disabled=true);
 if(choice!==q.correct){button.classList.add('incorrect');feedback.className='quest-feedback bad';feedback.textContent='Belum tepat. Petunjuk: '+q.explain;setTimeout(()=>{buttons.forEach(b=>{b.disabled=false;b.classList.remove('incorrect')});feedback.className='quest-feedback';feedback.textContent='Coba lagi, penjelajah. Gunakan petunjuk di atas.'},1000);return;}
 button.classList.add('correct');feedback.className='quest-feedback good';feedback.textContent='Misi berhasil! '+q.explain;
 award('quest:'+id+':'+stage,8);
 setTimeout(()=>{state.quest[id]=stage+1;save();if(state.quest[id]>=3)award('chapter:'+id,25);if(state.page===id)render();else nav();},850);
}
function questReplay(id){state.quest[id]=0;save();const c=chapters.find(x=>x.id===id);const root=document.getElementById('game');if(root)root.innerHTML=gameHTML(c)}
function miniTool(type){const out=document.getElementById('miniFeedback');const map={panjang:['Tepat: panjang diukur dengan mistar atau meteran.','success'],massa:['Tepat: massa diukur menggunakan neraca.','success'],suhu:['Tepat: suhu diukur menggunakan termometer.','success']};out.textContent=map[type][0];out.className='mini-feedback success';}
function miniHeat(value){const v=+value;const field=document.getElementById('particleField');if(field)field.style.setProperty('--particle-speed',(1.8-v/65)+'s');const out=document.getElementById('miniFeedback');if(out)out.textContent='Energi: '+v+' · Keadaan: '+(v<34?'padat':v<68?'cair':'gas')+' · Partikel '+(v<34?'bergetar rapat':v<68?'lebih bebas bergerak':'bergerak bebas dan berjauhan');}
function miniDrive(mode){const rover=document.getElementById('miniRover'),out=document.getElementById('miniFeedback');if(mode==='reset'){rover.style.left='2%';out.textContent='Kendaraan kembali ke titik mulai.';return;}rover.style.left=mode==='glb'?'62%':'82%';rover.style.transition=mode==='glb'?'left 1.7s linear':'left .9s cubic-bezier(.1,.7,.2,1)';out.textContent=mode==='glb'?'GLB: model kendaraan bergerak dengan kelajuan tetap.':'GLBB: model kendaraan dipercepat, jarak bertambah lebih cepat.';}

function labData(id){
 if(!state.experiments[id])state.experiments[id]=JSON.parse(JSON.stringify(labDefaults[id]||{logs:[],lastResult:''}));
 const base=labDefaults[id]||{};
 Object.keys(base).forEach(k=>{if(state.experiments[id][k]===undefined)state.experiments[id][k]=base[k]});

function labQuestion(id){return ({'1a1':'Variabel mana memengaruhi hasil?','1a2':'Apa yang berubah pada partikel?','1a3':'Bagaimana waktu dan percepatan memengaruhi jarak?','2a1':'Bagaimana fungsi struktur sel berbeda?','2a2':'Apa peran organ pada jalur ini?','3a1':'Bagaimana rangsangan menjadi respons?','3a2':'Bagaimana tubuh mengoreksi gangguan?','3a3':'Apa yang berubah pada tiap tahap?','3a4':'Berapa peluang setiap genotipe?','3a5':'Apa pengaruh gaya, luas, dan kedalaman?'})[id]}
function labInference(id,d){if(id==='1a1')return 'Bandingkan beberapa uji dengan satu variabel diubah. Model ini tidak menggantikan eksperimen tanaman nyata.';if(id==='1a2')return d.energy<33?'Energi rendah: partikel rapat dan hanya bergetar.':d.energy<68?'Energi sedang: partikel dapat bergeser.':'Energi tinggi: partikel berjauhan dan bergerak bebas.';if(id==='1a3')return 'Bandingkan hasil saat satu parameter diubah dan parameter lain tetap.';if(id==='2a1')return d.cellType==='plant'?'Sel tumbuhan biasanya memiliki dinding sel, vakuola sentral besar, dan kloroplas pada jaringan fotosintetik.':'Sel hewan tidak memiliki dinding sel atau kloroplas.';if(id==='2a2')return 'Pilih tiap titik pada jalur untuk mempelajari peran dan urutan organ.';if(id==='3a1')return 'Jenis rangsangan menentukan reseptor yang aktif. Waktu reaksi pada laman ini hanyalah parameter latihan.';if(id==='3a2')return d.disturbed?'Gangguan memindahkan nilai model; regulasi memberi umpan balik untuk mendekatkannya ke acuan.':'Bandingkan kondisi acuan dengan kondisi saat gangguan diterapkan.';if(id==='3a3')return 'Amati urutan perubahan kromosom dari interfase hingga telofase.';if(id==='3a4')return 'Kombinasi alel menunjukkan peluang pada model sederhana, bukan hasil pasti untuk setiap anak.';if(id==='3a5')return d.pressureType==='solid'?'Tekanan padat meningkat jika gaya bertambah atau luas berkurang.':d.pressureType==='liquid'?'Tekanan hidrostatik meningkat saat kedalaman bertambah.':'Dengan suhu dianggap tetap, volume gas yang lebih kecil terkait tekanan lebih besar.';return 'Ubah variabel, amati hasil, dan tuliskan kesimpulan.'}

function labPreview(id){var c=chapters.find(function(x){return x.id===id}),root=document.querySelector('[data-lab-root="'+id+'"]');if(!c||!root)return;var d=labData(id),disp=root.querySelector('#labDisplay');if(disp)disp.innerHTML=labSceneHTML(id,d);labReport(c,d);root.querySelectorAll('[data-value]').forEach(function(el){var key=el.getAttribute('data-value');if(d[key]!==undefined)el.textContent=d[key]});if(id==='3a1'){var safe=root.querySelector('#safe-decision');if(safe)safe.textContent=d.safeDecision||'Pilih respons untuk melihat konsekuensinya.'}}

function labSummary(id,d){if(id==='1a1')return 'Kondisi cahaya '+d.light+'/10, air '+d.water+'/10, nutrien '+d.nutrient+'/10. Perkiraan tinggi model: '+labMetric(id,d).value+'.';if(id==='1a2')return 'Energi '+d.energy+'%. Fase model: '+labMetric(id,d).value+'.';if(id==='1a3')return 'v₀='+d.speed+' m/s, a='+d.acceleration+' m/s², t='+d.time+' s. Jarak model: '+labMetric(id,d).value+'.';if(id==='2a1')return 'Sampel '+(d.cellType==='plant'?'sel tumbuhan':'sel hewan')+'. Struktur diamati: '+labMetric(id,d).value+'.';if(id==='2a2')return 'Sistem '+labMetric(id,d).value+'. '+labMetric(id,d).note;if(id==='3a1')return 'Rangsangan '+labMetric(id,d).value+', waktu reaksi parameter '+d.reaction+' ms.';if(id==='3a2')return 'Variabel '+d.homeoSystem+'. '+labMetric(id,d).value+'.';if(id==='3a3')return 'Tahap '+labMetric(id,d).value+'. '+labMetric(id,d).note;if(id==='3a4')return 'Induk '+d.parentA+' × '+d.parentB+'. '+labMetric(id,d).value+'.';if(id==='3a5')return 'Eksperimen '+d.pressureType+'. '+labMetric(id,d).value+'. '+labMetric(id,d).note;return labMetric(id,d).value}
function labRun(id){var d=labData(id),c=chapters.find(function(x){return x.id===id});if(id==='1a1'){d.planted=true;d.plantHeight=labMetric(id,d).value;}if(id==='1a3')d.started=true;var summary=labSummary(id,d),entry={title:'Pengamatan '+(d.logs.length+1),note:summary,time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};d.lastResult=summary;d.logs.unshift(entry);d.logs=d.logs.slice(0,6);save();award('labdone:'+id,15);if(d.logs.length>=3&&!state.done.includes(id))award('chapter:'+id,25);labPreview(id);if(c)toast('Data berhasil dicatat di buku pengamatan.');}
