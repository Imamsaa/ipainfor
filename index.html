const state={page:'home',xp:Number(localStorage.getItem('jelajah_xp')||0),done:JSON.parse(localStorage.getItem('jelajah_done')||'[]'),quiz:{},lab:{},score:0};
const $=s=>document.querySelector(s);
function save(){localStorage.setItem('jelajah_xp',state.xp);localStorage.setItem('jelajah_done',JSON.stringify(state.done));$('#xpPill').textContent='✦ '+state.xp+' XP'}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
function award(id,amount=20){if(!state.done.includes(id)){state.done.push(id);state.xp+=amount;save();toast('Misi selesai! +'+amount+' XP ✨')}else toast('Misi ini sudah tercatat. Terus eksplorasi!')}
function nav(){['1a','2a','3a'].forEach((b,i)=>{const el=$('#nav'+(i+1));el.innerHTML='';chapters.filter(c=>c.book===b).forEach(c=>{let btn=document.createElement('button');btn.className='navitem '+(state.page===c.id?'active':'');btn.innerHTML=`<span class="num">${c.n.toString().padStart(2,'0')}</span><span>${c.title}</span>`;btn.onclick=()=>go(c.id);el.append(btn)})})}
function go(id){state.page=id;$('#sidebar').classList.remove('open');render();nav();window.scrollTo(0,0)}
function home(){return `<section class="hero"><div><div class="eyebrow">✦ LABORATORIUM BELAJAR SMP</div><h1>IPA bukan cuma<br><span style="color:var(--cyan)">dibaca.</span> Rasakan!</h1><p>Eksperimen virtual, simulasi, tantangan, dan misi sains. Jelajahi 10 bab dari buku Jawara IPA 1a, 2a, dan 3a dengan cara yang lebih aktif.</p><button class="btn" onclick="go('1a1')">Mulai petualangan ↗</button> <button class="btn secondary" onclick="document.getElementById('chapters').scrollIntoView({behavior:'smooth'})">Pilih bab</button></div><div class="hero-art"><div class="orbit"></div><div class="orbit two"></div><div class="orb">⚗️</div></div></section><div class="stats"><div class="stat"><strong>10</strong><span>Bab interaktif</span></div><div class="stat"><strong>${state.done.length}/10</strong><span>Misi diselesaikan</span></div><div class="stat"><strong>${state.xp} ✦</strong><span>Total XP kamu</span></div></div><div class="section-head"><div><h2>Pilih laboratorium</h2><p>Setiap buku punya dunia eksplorasi sendiri.</p></div></div><div class="book-grid"><div class="book" onclick="go('1a1')"><div class="emoji">🧪</div><h3>Buku 1a · IPA Dasar</h3><p>Sains, zat, gerak, dan gaya.</p><div class="progressbar"><i style="width:${chapters.filter(c=>c.book==='1a'&&state.done.includes(c.id)).length/3*100}%"></i></div><small>${chapters.filter(c=>c.book==='1a'&&state.done.includes(c.id)).length}/3 bab tuntas</small></div><div class="book" onclick="go('2a1')"><div class="emoji">🧬</div><h3>Buku 2a · Biologi</h3><p>Sel dan sistem tubuh makhluk hidup.</p><div class="progressbar"><i style="width:${chapters.filter(c=>c.book==='2a'&&state.done.includes(c.id)).length/2*100}%"></i></div><small>${chapters.filter(c=>c.book==='2a'&&state.done.includes(c.id)).length}/2 bab tuntas</small></div><div class="book" onclick="go('3a1')"><div class="emoji">🌌</div><h3>Buku 3a · Sistem & Fisika</h3><p>Koordinasi, homeostasis, genetika, tekanan.</p><div class="progressbar"><i style="width:${chapters.filter(c=>c.book==='3a'&&state.done.includes(c.id)).length/5*100}%"></i></div><small>${chapters.filter(c=>c.book==='3a'&&state.done.includes(c.id)).length}/5 bab tuntas</small></div></div><div class="section-head" id="chapters"><div><h2>Semua misi</h2><p>Tekan bab untuk masuk ke halaman belajar dan game yang berbeda.</p></div></div><div class="chapter-list">${chapters.map(c=>`<button class="chapter-card" onclick="go('${c.id}')"><span class="chapter-icon">${c.icon}</span><span><small>BUKU ${c.book.toUpperCase()} · BAB ${c.n} ${state.done.includes(c.id)?' · ✓ TUNTAS':''}</small><b>${c.title}</b></span><span class="arrow">↗</span></button>`).join('')}</div>`}
function chapterPage(c){return `<div class="chapter-header"><span class="tag">BUKU ${c.book.toUpperCase()} · BAB ${c.n}</span><h1>${c.icon} ${c.title}</h1><p>${c.desc}</p><div class="progressbar"><i style="width:${state.done.includes(c.id)?100:0}%"></i></div><small class="muted">${state.done.includes(c.id)?'Misi bab telah diselesaikan':'Selesaikan aktivitas untuk mendapatkan XP'}</small></div><div class="learn-grid"><section class="panel"><div class="eyebrow">01 · MISI BELAJAR</div><h2>Target eksplorasi</h2><p class="muted">${c.goal}</p><h3>Yang akan kamu pelajari</h3><ul class="objectives">${c.topics.map(t=>`<li>${t}</li>`).join('')}</ul><div class="key-concept"><b>Inti konsep</b><br>${c.concept}</div><p class="muted" style="font-size:12px">Baca konsep, coba simulasi, lalu jawab tantangan. Hasil game adalah latihan belajar, bukan pengganti praktikum nyata.</p></section><section class="panel"><div class="eyebrow">02 · LAB INTERAKTIF</div><h2>${gameTitle(c.game)}</h2><div class="game" id="game">${gameHTML(c)}</div></section></div><section class="panel" style="margin-top:16px"><div class="eyebrow">03 · CEK PEMAHAMAN</div><h2>Tantangan cepat</h2><p class="muted">Pilih jawaban paling tepat. Baca penjelasannya setelah menjawab.</p><div id="quiz">${quizHTML(c)}</div></section><div class="footer-actions"><button class="btn secondary" onclick="prev('${c.id}')">← Bab sebelumnya</button><button class="btn" onclick="next('${c.id}')">Bab berikutnya →</button></div>`}
function gameTitle(g){return ({lab:'Rancang eksperimen',matter:'Pabrik perubahan wujud',motion:'Lintasan gerak',cell:'Bangun sel',body:'Jalur sistem tubuh',senses:'Misi respons indra',homeo:'Pusat kendali homeostasis',repro:'Misi pertumbuhan sel',genes:'Laboratorium genetika',pressure:'Uji tekanan'})[g]}
function gameHTML(c){switch(c.game){
case'lab':return `<div class="game-top"><h3>Eksperimen: tanaman</h3><span class="tag">SIMULASI</span></div><div class="game-stage"><div class="visual" id="plant">🌱</div><b id="plantLabel">Pilih satu variabel untuk diuji</b><p class="muted" id="plantText">Apa yang terjadi jika cahaya berubah, sementara air tetap?</p><div class="sim-controls"><label>Cahaya<select id="light" class="choice"><option value="low">Rendah</option><option value="high">Tinggi</option></select></label><label>Air<select id="water" class="choice"><option value="same">Tetap</option><option value="low">Sedikit</option></select></label></div><button class="btn small" style="margin-top:12px" onclick="runLab('plant')">Jalankan eksperimen</button></div><div class="feedback" id="gameFeedback">Ubah satu variabel, lalu amati hasil simulasi.</div>`;
case'matter':return `<div class="game-top"><h3>Atur energi partikel</h3><span class="tag">SIMULASI</span></div><div class="game-stage"><div class="visual" id="matterEmoji">🧊</div><b id="matterState">Padat</b><p id="matterDesc" class="muted">Partikel berdekatan dan bergetar di tempat.</p><label style="width:100%;max-width:300px">Energi panas <b id="heatVal">10</b><input id="heat" class="range" type="range" min="0" max="100" value="10" oninput="heatMatter(this.value)"></label><div class="meter"><i id="heatMeter" style="width:10%"></i></div></div><div class="feedback" id="gameFeedback">Geser panas dan amati perubahan wujud.</div><div class="game-actions"><button class="choice" onclick="matterChange('physical')">Contoh fisika</button><button class="choice" onclick="matterChange('chemical')">Contoh kimia</button></div>`;
case'motion':return `<div class="game-top"><h3>Uji mobil mainan</h3><span class="tag">GLB / GLBB</span></div><div class="game-stage"><div class="canvas-sim"><div class="ball" id="motionBall"></div><div style="position:absolute;bottom:10px;left:10px;right:10px;border-top:2px dashed #52708e"></div></div><div class="sim-controls"><label>Mode<select class="choice" id="motionMode"><option value="glb">GLB · kelajuan tetap</option><option value="glbb">GLBB · dipercepat</option></select></label><label>Waktu <span id="timeVal">2</span> s<input class="range" id="time" type="range" min="1" max="5" value="2" oninput="$('#timeVal').textContent=this.value"></label></div><button class="btn small" onclick="runLab('motion')">Jalankan mobil ▶</button><p id="motionResult" class="muted">Atur mode dan waktu, lalu jalankan.</p></div><div class="feedback" id="gameFeedback">Bandingkan jarak tempuh pada waktu yang sama.</div>`;
case'cell':return `<div class="game-top"><h3>Susun bagian sel</h3><span class="tag">PUZZLE</span></div><div class="game-stage"><div class="visual" id="cellEmoji">🌿</div><b id="cellPrompt">Bagian apa yang menjadi pembatas kuat sel tumbuhan?</b><div class="quiz-options"><button class="choice" onclick="cellPick('dinding')">Dinding sel</button><button class="choice" onclick="cellPick('inti')">Inti sel</button><button class="choice" onclick="cellPick('membran')">Membran sel</button><button class="choice" onclick="cellPick('mito')">Mitokondria</button></div><p id="cellExplain" class="muted"></p></div><div class="feedback" id="gameFeedback">Pilih struktur yang tepat untuk menyelesaikan puzzle.</div>`;
case'body':return `<div class="game-top"><h3>Antarkan nutrien dan oksigen</h3><span class="tag">RANGKAIAN</span></div><div class="game-stage"><p class="muted">Pilih jalur yang tepat agar oksigen dari udara sampai ke sel tubuh.</p><div class="timeline"><span>🌬️ Udara</span><span>❓</span><span>🫀 Darah</span><span>🧍 Sel tubuh</span></div><div class="quiz-options"><button class="choice" onclick="bodyPick(0)">Alveolus paru-paru</button><button class="choice" onclick="bodyPick(1)">Lambung</button><button class="choice" onclick="bodyPick(2)">Ginjal</button><button class="choice" onclick="bodyPick(3)">Usus besar</button></div><p id="bodyExplain" class="muted"></p></div><div class="feedback" id="gameFeedback">Lengkapi jalur kerja sistem tubuh.</div>`;
case'senses':return `<div class="game-top"><h3>Detektif rangsangan</h3><span class="tag">COCOKKAN</span></div><div class="game-stage"><div class="visual" id="senseEmoji">🔔</div><b id="sensePrompt">Bunyi bel diterima oleh indra apa?</b><div class="game-actions"><button class="choice" onclick="sensePick('mata')">Mata</button><button class="choice" onclick="sensePick('telinga')">Telinga</button><button class="choice" onclick="sensePick('kulit')">Kulit</button><button class="choice" onclick="sensePick('lidah')">Lidah</button></div><p id="senseExplain" class="muted"></p></div><div class="feedback" id="gameFeedback">Kenali rangsangan dan alat indra.</div>`;
case'homeo':return `<div class="game-top"><h3>Jaga suhu tubuh</h3><span class="tag">KENDALI</span></div><div class="game-stage"><div class="visual" id="thermo">🌡️</div><b>Suhu simulasi: <span id="tempVal">37</span>°C</b><div class="meter"><i id="tempMeter" style="width:50%"></i></div><p id="tempText" class="muted">Kondisi stabil. Pertahankan keseimbangan.</p><div class="game-actions"><button class="choice" onclick="tempChange(-2)">❄️ Lingkungan dingin</button><button class="choice" onclick="tempChange(2)">☀️ Lingkungan panas</button><button class="choice" onclick="tempReset()">Pulihkan keseimbangan</button></div></div><div class="feedback" id="gameFeedback">Amati respons tubuh ketika suhu berubah.</div>`;
case'repro':return `<div class="game-top"><h3>Urutan pertumbuhan</h3><span class="tag">URUTKAN</span></div><div class="game-stage"><p class="muted">Pilih tahapan dari yang paling awal hingga terbentuk jaringan.</p><div class="timeline" id="reproOrder"><span>🧩 Sel baru</span><span>🌱 Pertumbuhan</span><span>🔬 Pembelahan sel</span></div><div class="game-actions"><button class="choice" onclick="reproCheck()">Periksa urutan</button><button class="choice" onclick="reproShuffle()">Acak ulang</button></div><p id="reproExplain" class="muted">Urutan sekarang belum tentu benar.</p></div><div class="feedback" id="gameFeedback">Pikirkan bagaimana sel baru terbentuk dan digunakan tubuh.</div>`;
case'genes':return `<div class="game-top"><h3>Persilangan Aa × Aa</h3><span class="tag">GENETIKA</span></div><div class="game-stage"><p class="muted">Pilih satu alel dari setiap induk untuk membentuk kombinasi keturunan.</p><div class="game-actions"><label>Induk 1<select id="geneA" class="choice"><option>A</option><option>a</option></select></label><label>Induk 2<select id="geneB" class="choice"><option>A</option><option>a</option></select></label></div><div class="visual" id="geneResult">🧬</div><b id="geneLabel">Pilih alel lalu gabungkan</b><button class="btn small" style="margin-top:12px" onclick="geneCombine()">Gabungkan alel</button><p id="geneExplain" class="muted"></p></div><div class="feedback" id="gameFeedback">Model sederhana membantu memahami peluang, bukan memastikan sifat seseorang.</div>`;
case'pressure':return `<div class="game-top"><h3>Eksperimen tekanan</h3><span class="tag">P = F / A</span></div><div class="game-stage"><div class="visual">📦</div><b>Gaya: <span id="forceVal">20</span> N</b><label style="width:100%;max-width:320px">Gaya<input id="force" class="range" type="range" min="5" max="50" value="20" oninput="pressureCalc()"></label><b>Luas bidang: <span id="areaVal">10</span> cm²</b><label style="width:100%;max-width:320px">Luas<input id="area" class="range" type="range" min="2" max="20" value="10" oninput="pressureCalc()"></label><div class="meter"><i id="pressureMeter" style="width:40%"></i></div><h3 id="pressureResult">Tekanan relatif: 2</h3><p id="pressureText" class="muted">Ubah gaya atau luas untuk membandingkan tekanan.</p></div><div class="feedback" id="gameFeedback">Coba gaya tetap dengan luas yang berbeda.</div>`;
} }
function quizHTML(c){let q=qs[c.id][0];return `<div class="quiz-question" data-index="0"><div class="tag">PERTANYAAN 1 / 3</div><h3>${q.q}</h3><div class="quiz-options">${q.a.map((a,i)=>`<button class="choice" onclick="answer('${c.id}',0,${i},this)">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div class="feedback" id="quizFeedback"></div><div class="game-actions"><button class="btn small" id="nextQ" disabled onclick="nextQuestion('${c.id}')">Pertanyaan berikutnya →</button></div></div>`}
function answer(id,qi,choice,btn){let qsx=qs[id],q=qsx[qi];if(state.quiz[id+qi]!==undefined)return;state.quiz[id+qi]=choice;let parent=btn.parentElement;[...parent.children].forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});$('#quizFeedback').textContent=(choice===q.c?'Benar! ':'Belum tepat. ')+q.e;$('#quizFeedback').style.color=choice===q.c?'#70e5b5':'#ffb2c9';$('#nextQ').disabled=false;if(choice===q.c){state.xp+=5;save()}}
function nextQuestion(id){let current=Object.keys(state.quiz).filter(k=>k.startsWith(id)).length;let qarr=qs[id];if(current>=qarr.length){award(id,20);$('#quiz').innerHTML=`<div class="game-stage"><div class="visual">🏆</div><h3>Tantangan selesai!</h3><p class="muted">Kamu telah menyelesaikan kuis bab ini. Coba simulasi lagi atau lanjut ke bab berikutnya.</p><button class="btn" onclick="go('${nextId(id)||id}')">Lanjut petualangan →</button></div>`;return}let q=qarr[current];$('#quiz').innerHTML=`<div class="quiz-question"><div class="tag">PERTANYAAN ${current+1} / ${qarr.length}</div><h3>${q.q}</h3><div class="quiz-options">${q.a.map((a,i)=>`<button class="choice" onclick="answer('${id}',${current},${i},this)">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div class="feedback" id="quizFeedback"></div><div class="game-actions"><button class="btn small" id="nextQ" disabled onclick="nextQuestion('${id}')">Lanjut →</button></div></div>`}
function runLab(type){if(type==='plant'){let l=$('#light').value,w=$('#water').value;$('#plant').textContent=w==='low'?'🥀':l==='high'?'🌿':'🌱';$('#plantLabel').textContent=w==='low'?'Tanaman tampak layu':l==='high'?'Cahaya cukup untuk fotosintesis':'Pertumbuhan mungkin terbatas';$('#plantText').textContent=w==='low'?'Air menjadi faktor pembatas. Untuk percobaan adil, ubah satu variabel dan jaga yang lain tetap.':l==='high'?'Catat hasil, lalu bandingkan dengan kondisi cahaya rendah.':'Ulangi dengan cahaya berbeda dan air tetap.';$('#gameFeedback').textContent='Observasi dicatat. Simulasi ini ilustrasi sederhana, bukan data eksperimen nyata.';award('lab-'+state.page,5)}
if(type==='motion'){let mode=$('#motionMode').value,t=+$('#time').value;let b=$('#motionBall');b.style.transition='left 1s ease-out';b.style.left=(mode==='glb'?10+t*13:10+t*t*4)+'%';$('#motionResult').textContent=mode==='glb'?`Model GLB: jarak bertambah sebanding dengan waktu (${t} s).`:`Model GLBB: jarak bertambah makin besar tiap interval waktu (${t} s).`;$('#gameFeedback').textContent='Bandingkan posisi akhir dan ulangi dengan waktu berbeda.';award('motion-'+state.page,5)}}
function heatMatter(v){v=+v;$('#heatVal').textContent=v;$('#heatMeter').style.width=v+'%';let s=v<33?['🧊','Padat','Partikel rapat, bergetar di tempat.']:v<67?['💧','Cair','Partikel lebih bebas bergerak dan dapat mengalir.']:['☁️','Gas','Partikel berjauhan dan bergerak bebas.'];$('#matterEmoji').textContent=s[0];$('#matterState').textContent=s[1];$('#matterDesc').textContent=s[2];$('#gameFeedback').textContent='Energi partikel berubah. Perubahan wujud tidak otomatis berarti terbentuk zat baru.'}
function matterChange(t){$('#gameFeedback').textContent=t==='physical'?'Contoh fisika: es mencair, air menguap, kertas dipotong. Zat tidak berubah menjadi zat baru.':'Contoh kimia: besi berkarat atau kayu terbakar. Terbentuk zat baru.';award('matter-'+state.page,3)}
function cellPick(x){let good=x==='dinding';$('#cellExplain').textContent=good?'Tepat! Dinding sel memberi dukungan dan perlindungan pada sel tumbuhan.':'Coba lagi. Ingat: yang dicari adalah lapisan kuat di luar membran sel tumbuhan.';$('#cellEmoji').textContent=good?'🌿':'🔎';$('#gameFeedback').textContent=good?'Puzzle terpecahkan!':'Belum tepat, amati petunjuknya.';if(good)award('cell-'+state.page,5)}
function bodyPick(x){$('#bodyExplain').textContent=x===0?'Tepat! Oksigen masuk melalui saluran pernapasan dan berdifusi di alveolus, lalu diangkut darah ke sel.':'Belum tepat. Pilih bagian sistem pernapasan tempat pertukaran gas berlangsung.';$('#gameFeedback').textContent=x===0?'Jalur oksigen lengkap!':'Coba lagi.';if(x===0)award('body-'+state.page,5)}
let senseIndex=0;const senses=[['🔔','Bunyi bel diterima oleh indra apa?','telinga'],['🍋','Rasa asam dikenali oleh indra apa?','lidah'],['🌞','Cahaya terang diterima oleh indra apa?','mata'],['🧊','Sentuhan dingin dirasakan oleh indra apa?','kulit'],['🌸','Aroma bunga dikenali oleh indra apa?','hidung']];
function sensePick(v){let s=senses[senseIndex];let ok=v===s[2];$('#senseExplain').textContent=ok?'Benar! Rangsangan diterima reseptor yang sesuai.':'Belum tepat. Pikirkan jenis rangsangannya.';if(ok){senseIndex=(senseIndex+1)%senses.length;setTimeout(()=>{let n=senses[senseIndex];$('#senseEmoji').textContent=n[0];$('#sensePrompt').textContent=n[1]},650);award('sense-'+state.page,3)}$('#gameFeedback').textContent=ok?'Satu rangsangan berhasil dikenali.':'Coba lagi.'}
let temp=37;function tempChange(d){temp=Math.max(33,Math.min(41,temp+d));$('#tempVal').textContent=temp;$('#tempMeter').style.width=((temp-33)/8*100)+'%';$('#tempText').textContent=temp>37?'Tubuh merespons panas, misalnya melalui keringat dan pelebaran pembuluh darah kulit.':temp<37?'Tubuh membantu mempertahankan panas, misalnya dengan menggigil.':'Kondisi kembali ke nilai acuan simulasi.';$('#gameFeedback').textContent='Homeostasis bekerja menjaga kondisi internal tetap dalam rentang yang sesuai.'}function tempReset(){temp=37;tempChange(0);award('homeo-'+state.page,5)}
let repro=['🔬 Pembelahan sel','🧩 Sel baru','🌱 Pertumbuhan'];function reproDraw(){$('#reproOrder').innerHTML=repro.map((x,i)=>`<button class="choice" onclick="reproMove(${i})">${x} ↕</button>`).join('')}function reproMove(i){if(i<repro.length-1){[repro[i],repro[i+1]]=[repro[i+1],repro[i]];reproDraw()}}function reproShuffle(){repro=['🌱 Pertumbuhan','🔬 Pembelahan sel','🧩 Sel baru'];reproDraw();$('#reproExplain').textContent='Coba susun kembali dari proses awal.'}function reproCheck(){let ok=repro[0].includes('Pembelahan')&&repro[1].includes('Sel baru')&&repro[2].includes('Pertumbuhan');$('#reproExplain').textContent=ok?'Tepat! Pembelahan menghasilkan sel baru yang mendukung pertumbuhan.':'Belum tepat. Pembelahan sel terjadi sebelum sel baru digunakan untuk pertumbuhan.';if(ok)award('repro-'+state.page,5)}
function geneCombine(){let a=$('#geneA').value,b=$('#geneB').value,r=a+b;$('#geneResult').textContent='🧬';$('#geneLabel').textContent=r==='aA'?'Aa':r;$('#geneExplain').textContent='Kombinasi alel yang kamu pilih membentuk genotipe '+(r==='aA'?'Aa':r)+'. Dalam persilangan Aa × Aa, empat kombinasi sama peluang pada model sederhana.';award('gene-'+state.page,3)}
function pressureCalc(){let f=+$('#force').value,a=+$('#area').value,p=f/a;$('#forceVal').textContent=f;$('#areaVal').textContent=a;$('#pressureResult').textContent='Tekanan relatif: '+p.toFixed(2);$('#pressureMeter').style.width=Math.min(100,p/25*100)+'%';$('#pressureText').textContent=p>3?'Tekanan relatif tinggi karena gaya besar dibanding luas bidang.':p<1.5?'Tekanan relatif rendah karena gaya kecil dibanding luas bidang.':'Tekanan relatif sedang. Coba kecilkan luas dengan gaya tetap.'}
function gameTitleDummy(){}
function nextId(id){let i=chapters.findIndex(c=>c.id===id);return chapters[(i+1)%chapters.length].id}function prev(id){let i=chapters.findIndex(c=>c.id===id);go(chapters[(i+chapters.length-1)%chapters.length].id)}function next(id){let i=chapters.findIndex(c=>c.id===id);go(chapters[(i+1)%chapters.length].id)}
function render(){let c=chapters.find(c=>c.id===state.page);$('#crumb').textContent=c?`Jelajah IPA / Buku ${c.book.toUpperCase()} / Bab ${c.n}`:'Jelajah IPA / Beranda';$('#content').innerHTML=c?chapterPage(c):home();$('#xpPill').textContent='✦ '+state.xp+' XP';if(c&&c.game==='pressure')pressureCalc();if(c&&c.game==='repro')reproDraw()}
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');document.querySelector('[data-home]').onclick=()=>go('home');window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sidebar').classList.remove('open')});nav();render();
</script>
